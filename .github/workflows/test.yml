name: Run tests

on: [push]

jobs:
  node:
    name: Test with Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      # Python toolchain for the cross-implementation interop tests
      # (backbone, WebSocket, LXMF paper/propagation): those tests
      # self-skip when Python/RNS are unavailable.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rns lxmf websockets
      - run: npm ci
      - run: npm run lint
      - run: npm run types
      - run: npm test
  deno:
    name: Test with Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.x'
          cache: true
      - run: deno install
      - run: deno run test:deno
  bun:
    name: Test with Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run test:bun
