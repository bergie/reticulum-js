name: Publish to npm

# Additional convenience distribution to the npm registry.
# The CANONICAL release is the rngit release (signed tarballs over the mesh);
# this workflow merely mirrors the same tagged versions to npmjs.com so the
# broader JS ecosystem can `npm install` them. It runs only when a `v*` tag
# reaches the `github` remote.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

# Never run two publishes for the same tag at once; never cancel one mid-flight.
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          # Writing registry-url makes setup-node author ~/.npmrc for publish,
          # using the NODE_AUTH_TOKEN env var on the publish step.
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Lockstep: the tag (minus the leading v) must equal the package versions.
      # Stops a stray/mistyped tag from publishing unintended versions.
      - name: Verify the tag matches the package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CORE=$(node -p "require('./packages/core/package.json').version")
          echo "Tag: $TAG   core version: $CORE"
          if [ "$TAG" != "$CORE" ]; then
            echo "::error::Tag 'v$TAG' does not match packages version '$CORE'"
            exit 1
          fi

      # types/ is git-ignored/generated, not committed — generate it for the
      # tarballs (this also type-checks).
      - name: Generate type declarations
        run: npm run types

      # `types/` is git-ignored (build artifacts, never committed). JSR's
      # underlying `deno publish` honors `.gitignore`, so it would drop the
      # declarations — un-ignore them here so the `jsr publish` steps below
      # can ship them. Affects only the ephemeral CI checkout. See
      # `scripts/jsr-dryrun.sh` for the equivalent local helper.
      - name: Expose generated declarations to JSR
        run: printf '\n!packages/*/types/**\n' >> .gitignore

      - name: Run tests
        run: npm test

      # Publish every package independently: one failing package must not
      # block the rest — the loops below continue past failures and only
      # fail the job for packages that already exist on the registry.
      #
      # Why that distinction: the FIRST release of a new package (e.g.
      # @reticulum/rngit) cannot be published via the GitHub Actions OIDC
      # flow, because the package does not exist on npm/JSR yet and thus
      # has no trusted publisher registered. Those failures are expected:
      # the run stays green (everything else is published), and the step
      # summary lists the manual follow-up command. Publish the new package
      # once by hand, register the trusted publisher on npm/JSR, and every
      # later release publishes it automatically too.
      - name: Publish all to NPM
        run: |
          set -uo pipefail
          real_failures=0
          for dir in packages/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            echo "::group::npm publish $name"
            if npm publish "$dir" --access public; then
              echo "published $name"
            elif npm view "$name" version &>/dev/null; then
              echo "::error::$name exists on npm but failed to publish"
              real_failures=$((real_failures+1))
            else
              echo "::warning::$name is not on npm yet (new package, no trusted publisher for OIDC). Publish it manually once, then register the trusted publisher."
              {
                echo "### Manual follow-up"
                echo "- NPM: \`cd $dir && npm publish --access public\`, then register the GitHub Actions trusted publisher for it on npmjs.com"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          exit "$real_failures"

      - name: Publish all to JSR
        run: |
          set -uo pipefail
          real_failures=0
          for dir in packages/*/; do
            [ -f "$dir/jsr.json" ] || continue
            name=$(node -p "require('./$dir/jsr.json').name")
            echo "::group::jsr publish $name"
            if (cd "$dir" && npx -y jsr publish --allow-dirty); then
              echo "published $name"
            elif curl -fsS -o /dev/null "https://jsr.io/$name/meta.json"; then
              echo "::error::$name exists on JSR but failed to publish"
              real_failures=$((real_failures+1))
            else
              echo "::warning::$name is not on JSR yet (new package, no trusted publisher for OIDC). Publish it manually once, then register the trusted publisher."
              {
                echo "### Manual follow-up"
                echo "- JSR: \`cd $dir && npx -y jsr publish\` (needs a JSR auth token), then register the GitHub Actions trusted publisher for it on jsr.io"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          exit "$real_failures"
